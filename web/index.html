<!doctype html>
<!-- Ketcher's full-screen button shows the element marked data-ketcher-fullscreen-container:
     the whole page, so the header, the panels, the Group button and Ketcher's own lists (which
     open outside the app's root) all show (docs/plans/v1-release.md, review rounds 1 and 2). -->
<html lang="en" data-ketcher-fullscreen-container>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <!-- Relative, so the browser never asks for /favicon.ico at the site root. -->
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <title>MU Draw</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
