[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
# No test may touch the network. --allow-unix-socket keeps asyncio's
# internal socketpair (TestClient, anyio) working.
addopts = "--disable-socket --allow-unix-socket -p no:cacheprovider"
testpaths = ["tests", "server/tests"]
pythonpath = ["server", "scripts", "server/scripts", "tests"]

[tool.ruff.lint.isort]
# Import roots added by pytest's pythonpath.
known-first-party = [
  "build_glassware",
  "build_practice_lists",
  "cache",
  "checks",
  "chem",
  "lib",
  "main",
  "pubchem",
  "record_ghs",
  "record_name_lookups",
  "record_pubchem_names",
  "conftest",
  "conftest_sample",
  "fakes",
  "ghs",
  "opsin",
  "fetch_reference_smiles",
  "gen_biochem_expected",
  "gen_reference_expected",
  "gen_templates",
  "test_name",
  "test_reference_fixtures",
  "render_server_config",
  "threed",
  "record_conformers",
]
