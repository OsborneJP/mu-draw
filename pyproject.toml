[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
# No test may touch the network. --allow-unix-socket keeps asyncio's
# internal socketpair (TestClient, anyio) working.
addopts = "--disable-socket --allow-unix-socket -p no:cacheprovider"
testpaths = ["tests", "server/tests"]
pythonpath = ["server", "scripts", "server/scripts"]

[tool.ruff.lint.isort]
# Import roots added by pytest's pythonpath.
known-first-party = [
  "checks", "lib", "main", "conftest", "fetch_reference_smiles", "gen_reference_expected",
]
